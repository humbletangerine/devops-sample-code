apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/alert_rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: product-api-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['quick-commerce']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: 'Running'
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: '(.+)'
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '$1:$2'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
      - job_name: kubernetes-cadvisor
        scheme: https
        kubernetes_sd_configs:
          - role: node
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          server_name: kubernetes.default.svc
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
  alert_rules.yml: |
    groups:
      - name: quick-commerce-alerts
        rules:
          - alert: ProductAPIReplicaShortfall
            expr: sum(up{job="product-api-pods"}) < 3
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Product API has fewer than three healthy replicas
              description: The expected capacity is three healthy API pods. Losing one removes at least one-third of the intended replica capacity.
          - alert: ProductAPIHighProcessCPU
            expr: max(app_process_cpu_percent{job="product-api-pods"}) > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Product API worker CPU is above 80 percent
              description: A worker has stayed above 80 percent CPU for two minutes; inspect traffic and pod resource limits.
