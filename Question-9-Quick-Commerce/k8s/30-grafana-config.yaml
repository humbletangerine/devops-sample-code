apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: true
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: Quick Commerce
        orgId: 1
        folder: Quick Commerce
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
